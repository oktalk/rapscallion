name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI=true makes Vitest run the tests once instead of in watch mode.
      # Lint warnings are enforced by the separate Lint workflow.
      - name: Run unit tests
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

  e2e:
    name: Cypress end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs dependencies with npm ci (caching the Cypress binary),
      # starts the dev server, waits for it, then runs `cypress run`.
      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 120
        env:
          BROWSER: none

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
