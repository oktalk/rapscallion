name: Feature request
description: Suggest a new game mode, rule change, UI improvement, or tooling change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A maintainer will review it and confirm whether it fits the project before anyone starts building it.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what is missing or frustrating today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work. For rule changes, explain how the change interacts with shields, potions, and running.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any other approaches you thought about.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
